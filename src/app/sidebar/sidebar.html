<aside class="chat-sidebar">
  <header class="cs-header">
    <h1>Chats</h1>
  </header>

  <div class="cs-search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
      />
    </svg>
    <input
      type="text"
      placeholder="Search or start a new chat"
      [value]="search()"
      (input)="onSearch($event)"
    />
  </div>

  <div class="cs-filters">
    <button type="button" [class.on]="filter() === 'all'" (click)="filter.set('all')">All</button>
    <button type="button" [class.on]="filter() === 'unread'" (click)="filter.set('unread')">
      Unread
    </button>
    <button type="button" [class.on]="filter() === 'groups'" (click)="filter.set('groups')">
      Groups
    </button>
  </div>

  <ul class="cs-list">
    @for (r of rows(); track r.contact.id) {
      <li>
        <button
          type="button"
          class="cs-row"
          [class.active]="activeId() === r.contact.id"
          (click)="open(r.contact.id)"
        >
          <div class="cs-avatar" [style.background]="r.contact.color">
            @if (r.contact.isGroup) {
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3 0-7 1.5-7 4.5V20h14v-2.5C16 14.5 12 13 9 13zm7.5.2c.4 0 .8-.1 1.5-.1 2.5 0 5 1.2 5 3.9V20h-5v-2.5c0-1.7-.7-3.1-1.5-4.3z"
                />
              </svg>
            } @else {
              {{ r.initials }}
            }
            @if (r.contact.online && !r.contact.isGroup) {
              <span class="cs-online"></span>
            }
          </div>

          <div class="cs-body">
            <div class="cs-top">
              <span class="cs-name">{{ r.contact.name }}</span>
              <span class="cs-time" [class.unread]="r.unread > 0">{{ r.time }}</span>
            </div>
            <div class="cs-bottom">
              <span class="cs-preview">{{ r.preview }}</span>
              @if (r.unread > 0) {
                <span class="cs-badge" [class.muted]="r.muted">{{ r.unread }}</span>
              }
            </div>
          </div>
        </button>
      </li>
    } @empty {
      <li class="cs-empty">No chats found</li>
    }
  </ul>
</aside>
