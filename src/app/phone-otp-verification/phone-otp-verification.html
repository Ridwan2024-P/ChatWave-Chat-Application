    <app-auth-shell>
      <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card sm:p-8">
        <p class="text-xs font-semibold tracking-wider text-wa-dark uppercase">Step 2 of 2</p>
        <div class="mt-2 mb-5 flex gap-1.5" aria-hidden="true"><span class="h-1 flex-1 rounded-full bg-wa"></span><span class="h-1 flex-1 rounded-full bg-wa"></span></div>
        <h1 class="text-2xl font-bold tracking-tight">Verify your number</h1>
        <p class="mt-1.5 text-slate-600">Enter the 6-digit code for <strong class="text-slate-900">{{ masked }}</strong>.</p>
        <div class="mt-5 rounded-xl border border-dashed border-amber-300 bg-amber-50 p-3.5 text-center text-sm text-amber-900">
          <span class="text-xs font-semibold tracking-wide uppercase">Demo only · simulated OTP, no SMS sent</span><br />
          <span class="font-mono text-2xl font-bold tracking-[0.3em]" data-testid="mock-otp">{{ mockOtp() }}</span>
        </div>
        <div class="mt-6">
          <brn-input-otp [length]="6" inputMode="numeric" [value]="code()" (valueChange)="code.set($event)"
                         (completed)="verify()" [transformPaste]="digitsOnly" aria-label="Six digit verification code">
            <div class="flex justify-center gap-2 sm:gap-3">
              @for (i of slots; track i) {
                <brn-input-otp-slot [index]="i" [forceInvalid]="!!error()"
                  class="flex size-12 items-center justify-center rounded-xl border border-slate-200 bg-white text-xl font-semibold shadow-sm transition sm:size-14
                         data-[active=true]:border-wa-dark data-[active=true]:ring-2 data-[active=true]:ring-wa-dark/25 data-[invalid=true]:border-red-500 data-[matches-spartan-invalid=true]:border-red-500">
                  <span class="h-6 w-px animate-pulse bg-slate-700"></span>
                </brn-input-otp-slot>
              }
            </div>
          </brn-input-otp>
        </div>
        @if (error()) { <p role="alert" class="mt-3 text-center text-sm text-red-600">{{ error() }}</p> }
        <button type="button" class="btn-primary mt-6 w-full" (click)="verify()" [disabled]="loading()">
          @if (loading()) { <span class="size-4 animate-spin rounded-full border-2 border-wa-deep/30 border-t-wa-deep"></span> Verifying… } @else { Verify }
        </button>
        <p class="mt-4 text-center text-sm text-slate-600">
          @if (seconds() > 0) { Resend code in <span class="font-semibold tabular-nums">0:{{ seconds().toString().padStart(2, '0') }}</span> }
          @else { <button type="button" class="font-semibold text-wa-dark underline underline-offset-2" (click)="resend()">Resend OTP</button> }
        </p>
      </section>
      <button type="button" class="btn-ghost mt-3 w-full" (click)="changeNumber()"><svg lucideArrowLeft class="size-4"></svg> Change number</button>
    </app-auth-shell>
